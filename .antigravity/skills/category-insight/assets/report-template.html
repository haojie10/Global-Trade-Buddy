<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!-- REPORT_BROWSER_TITLE --></title>

    <!-- 元数据规范：必须严格使用GTB 54个标准行业之一 -->
    <meta name="category" content="{{CATEGORY}}">
    <meta name="summary" content="{{SUMMARY}}">
    <meta name="company_name" content="{{COMPANY_NAME}}">
    <meta name="company_aliases" content="{{COMPANY_ALIASES}}">
    <meta name="company_website" content="{{COMPANY_WEBSITE}}">
    <meta name="competitors" content="{{COMPETITORS}}">
    <meta name="products" content="{{PRODUCTS}}">
    <meta name="regions" content="{{REGIONS}}">
    <meta name="channels" content="{{CHANNELS}}">
    <meta name="suppliers" content="{{SUPPLIERS}}">
    <meta name="customers" content="{{CUSTOMERS}}">
    <meta name="sister_parents" content="{{SISTER_PARENTS}}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff641e;
            --primary-rgb: 255, 100, 30;
            --secondary: #7a756f;
            --bg-main: #fdfbf7;
            --bg-sub: #f6f3ec;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-border: rgba(160, 109, 68, 0.14);
            --text-primary: #2d2a26;
            --text-secondary: #57524c;
            --text-muted: #7e7871;
            --success: #15803d;
            --warning: #b45309;
            --danger: #b91c1c;
            --shadow-sm: 0 4px 12px rgba(160, 109, 68, 0.05);
            --shadow-lg: 0 12px 28px -6px rgba(160, 109, 68, 0.1);
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.65;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
            padding: 3rem 2rem 2.5rem;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 20%;
            width: 60%;
            height: 200%;
            background: radial-gradient(circle, rgba(var(--primary-rgb), 0.08) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .meta-tag {
            display: inline-block;
            background: rgba(var(--primary-rgb), 0.09);
            color: var(--primary);
            padding: 0.35rem 1.2rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(var(--primary-rgb), 0.2);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.85rem;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 860px;
            margin: 0 auto 1.5rem auto;
            position: relative;
            z-index: 1;
        }

        .meta-info-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            font-size: 0.88rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(160, 109, 68, 0.12);
            padding-top: 1.25rem;
            max-width: 820px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .meta-item strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* 顶部展台横幅 */
        .hero-banner-card {
            background: #ffffff;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2.25rem;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            align-items: center;
        }

        @media (max-width: 860px) {
            .hero-banner-card {
                grid-template-columns: 1fr;
            }
        }

        .hero-image-wrap {
            width: 100%;
            height: 100%;
            min-height: 280px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-sub);
        }

        .hero-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-content {
            padding: 2rem 2.25rem;
        }

        .hero-tag {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.5rem;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .hero-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        section {
            background: #ffffff;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 2.25rem;
            margin-bottom: 2.25rem;
            box-shadow: var(--shadow-sm);
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 1.6rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-left: 4px solid var(--primary);
            padding-left: 0.85rem;
            color: var(--text-primary);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid rgba(160, 109, 68, 0.08);
            vertical-align: top;
        }

        th {
            background-color: var(--bg-sub);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(160, 109, 68, 0.02);
        }

        .channel-header {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .channel-header.target-ow { color: var(--primary); }
        .channel-header.comp-km { color: #0284c7; }
        .channel-header.comp-jb { color: #059669; }

        .matrix-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .badge-ow { background: rgba(255, 100, 30, 0.1); color: var(--primary); border: 1px solid rgba(255, 100, 30, 0.25); }
        .badge-km { background: rgba(2, 132, 199, 0.1); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.25); }
        .badge-jb { background: rgba(5, 150, 105, 0.1); color: #059669; border: 1px solid rgba(5, 150, 105, 0.25); }

        ul.matrix-list {
            list-style: none;
            padding-left: 0;
        }

        ul.matrix-list li {
            position: relative;
            padding-left: 1.1rem;
            margin-bottom: 0.4rem;
            font-size: 0.88rem;
        }

        ul.matrix-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 1.25rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.25rem;
        }

        .card {
            background: var(--bg-sub);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 1.5rem;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-tag {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            background: #ffffff;
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
        }

        .pain-point-box {
            border-left: 3px solid var(--danger);
            background: rgba(185, 28, 28, 0.04);
            padding: 1rem 1.25rem;
            border-radius: 0 10px 10px 0;
            margin-bottom: 1rem;
        }

        .pain-title {
            font-weight: 700;
            color: var(--danger);
            font-size: 0.95rem;
            margin-bottom: 0.35rem;
        }

        .pain-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        /* 概念产品专区 */
        .concept-card {
            background: #ffffff;
            border: 1px solid rgba(var(--primary-rgb), 0.2);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2.25rem;
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 0;
        }

        @media (max-width: 860px) {
            .concept-card {
                grid-template-columns: 1fr;
            }
        }

        .concept-visual {
            background: #fbf7f2;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--panel-border);
            overflow: hidden;
            position: relative;
            min-height: 320px;
        }

        .concept-visual img {
            width: 100%;
            height: 100%;
            min-height: 320px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .concept-visual:hover img {
            transform: scale(1.02);
        }

        .concept-body {
            padding: 1.85rem 2.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .concept-num {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }

        .concept-heading {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.85rem;
        }

        .concept-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .concept-text {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.55;
        }

        .concept-metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--panel-border);
        }

        .metric-block {
            background: var(--bg-sub);
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
        }

        .takeaway-banner {
            background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.08) 0%, rgba(var(--primary-rgb), 0.02) 100%);
            border: 1px solid rgba(var(--primary-rgb), 0.25);
            border-radius: 14px;
            padding: 1.5rem 1.75rem;
            margin-top: 1.5rem;
        }

        .takeaway-banner h4 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .takeaway-banner p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
            padding: 2rem 0 1rem;
        }
    </style>
</head>
